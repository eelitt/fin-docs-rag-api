[project]
name = "fin-docs-rag"
version = "0.1.0"
description = "Cited fact sheet over a fixed shelf of public fund documents."
requires-python = ">=3.12"
dependencies = [
  "azure-identity>=1.19",
  "azure-monitor-opentelemetry-exporter>=1.0.0b31",
  "azure-search-documents>=11.6",
  "azure-storage-blob>=12.24",
  "fastapi>=0.115",
  "openai>=1.60",
  "pymupdf>=1.24",
  "tiktoken>=0.7",
]

[project.scripts]
ingest = "fin_docs_rag.ingest.run:main"
eval-run = "fin_docs_rag.eval.run:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mlflow>=3.18.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_docs_rag"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
