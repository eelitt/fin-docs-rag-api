[project]
name = "fin-docs-rag"
version = "0.1.0"
description = "Cited fact sheet over a fixed shelf of public fund documents."
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.24",
  "tiktoken>=0.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_docs_rag"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
